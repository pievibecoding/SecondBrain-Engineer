services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondbrain}
      POSTGRES_DB: secondbrain
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-secondbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-secondbrain}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    env_file: ./lightrag/.env
    depends_on:
      - postgres
      - redis
    ports:
      - "9621:9621"
    volumes:
      - ./prompts:/app/prompts
    restart: unless-stopped

  graphiti-service:
    build: ./graphiti-service
    env_file: .env
    environment:
      GRAPHITI_DB_URL: postgresql+asyncpg://${POSTGRES_USER:-secondbrain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secondbrain}
    depends_on:
      - postgres
    ports:
      - "9622:9622"
    restart: unless-stopped

  nas-connector:
    build: ./nas-connector
    env_file: .env
    depends_on:
      - lightrag
      - backend
    volumes:
      - /mnt/synology:/mnt/nas:ro
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-secondbrain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secondbrain}
    depends_on:
      - postgres
      - redis
      - lightrag
      - graphiti-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULAS: "Y"
    volumes:
      - seq_data:/data
    ports:
      - "5380:80"
      - "5341:5341"
    restart: unless-stopped

  # ─── Phase 2: GPU server only ───────────────────────────────────
  # Uncomment khi có server RTX 4060 Ti 16GB
