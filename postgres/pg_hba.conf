# PostgreSQL Client Authentication Configuration
# Đổi từ scram-sha-256 sang md5 để SQLTools (driver 0.5.6) kết nối được với PG18
# Bug: SQLTools mtxr.sqltools-driver-pg-0.5.6 không handle SCRAM-SHA-256 với PG18

# Unix socket — trust (local docker exec)
local   all             all                                     trust

# Localhost IPv4/IPv6
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Replication
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# All other TCP connections — md5 (thay vì scram-sha-256)
host    all             all             all                     md5
